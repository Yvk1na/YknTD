content-version: 3

# 默认十波全部使用原版怪物，因此未安装 MythicMobs 也可游玩。
# 1～3 波对应 YknRpg 普通/少见装备与前期宠物，4～7 波对应稀有/史诗装备与中期宠物，
# 8～10 波对应传说/神话装备与后期宠物。基础生命/攻击同时参考了新版 AuraSkills
# 53 组分段奖励（1～50 / 51～80 / 81～100）与 YknRpg 的实际战斗公式。
# recommended-aura-level 是全体启用技能同步成长时的参考等级；开局分别取队伍进攻、
# 生存指数的中位数并锁定。怪物生命只跟进攻轴修正，攻击只跟生存轴修正。
# base-health/base-damage 是单人绝对基础值；后者会在 YknRpg 防御和 AuraSkills 减伤之前生效。
# amount-per-lane 保证四路压力一致，人数仍会按 config.yml 的 scaling 再缩放。

